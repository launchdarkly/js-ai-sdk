# This workflow handles both automated and manual package publishing:
#
# AUTOMATED PUBLISHING (on push to main):
#   - Triggered automatically when changes are pushed to the main branch
#   - Uses release-please to create releases based on conventional commits
#   - Publishes packages to npm via OIDC trusted publishing when release PRs are merged
#
# MANUAL PUBLISHING (via workflow_dispatch):
#   - Can be triggered manually from the Actions tab
#   - Allows publishing a specific package to npm
#   - Supports prerelease and dry-run modes
#
# RELEASE CANARY (after a publish, or on demand):
#   - Installs the exact published versions into a CommonJS Serverless/Webpack app
#   - Deploys, invokes, and removes an ephemeral Node 22 Lambda via GitHub OIDC
#   - Requires the AWS_LAMBDA_CANARY_ROLE_ARN repository variable; skipped while it is unset
#
name: release-please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      workspace_path:
        description: 'The workspace to publish'
        required: true
        default: 'packages/client'
        type: choice
        options:
          - packages/client
          - packages/ai-node
          - packages/ai-otel
          - packages/claude-agents
          - packages/claude-messages
          - packages/openai-agents
          - packages/openai-messages
          - packages/langchain-agents
          - packages/langchain-messages
      prerelease:
        description: 'Is this a prerelease. If so, then the latest tag will not be updated in npm.'
        type: boolean
        required: true
      dry_run:
        description: 'Is this a dry run. If so no package will be published.'
        type: boolean
        required: true
      canary_versions:
        description: 'Run only the Lambda release canary against these exact published versions, e.g. ai-node=0.3.0,openai-messages=0.3.0,ai-otel=0.2.0'
        type: string
        required: false
        default: ''

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    if: github.event_name == 'push'
    outputs:
      package-client-released: ${{ steps.release.outputs['packages/client--release_created'] }}
      package-client-tag-name: ${{ steps.release.outputs['packages/client--tag_name'] }}
      package-ai-node-released: ${{ steps.release.outputs['packages/ai-node--release_created'] }}
      package-ai-node-tag-name: ${{ steps.release.outputs['packages/ai-node--tag_name'] }}
      package-ai-otel-released: ${{ steps.release.outputs['packages/ai-otel--release_created'] }}
      package-ai-otel-tag-name: ${{ steps.release.outputs['packages/ai-otel--tag_name'] }}
      package-claude-agents-released: ${{ steps.release.outputs['packages/claude-agents--release_created'] }}
      package-claude-agents-tag-name: ${{ steps.release.outputs['packages/claude-agents--tag_name'] }}
      package-claude-messages-released: ${{ steps.release.outputs['packages/claude-messages--release_created'] }}
      package-claude-messages-tag-name: ${{ steps.release.outputs['packages/claude-messages--tag_name'] }}
      package-openai-agents-released: ${{ steps.release.outputs['packages/openai-agents--release_created'] }}
      package-openai-agents-tag-name: ${{ steps.release.outputs['packages/openai-agents--tag_name'] }}
      package-openai-messages-released: ${{ steps.release.outputs['packages/openai-messages--release_created'] }}
      package-openai-messages-tag-name: ${{ steps.release.outputs['packages/openai-messages--tag_name'] }}
      package-langchain-agents-released: ${{ steps.release.outputs['packages/langchain-agents--release_created'] }}
      package-langchain-agents-tag-name: ${{ steps.release.outputs['packages/langchain-agents--tag_name'] }}
      package-langchain-messages-released: ${{ steps.release.outputs['packages/langchain-messages--release_created'] }}
      package-langchain-messages-tag-name: ${{ steps.release.outputs['packages/langchain-messages--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

  # --- Per-package publish jobs ---

  release-client:
    runs-on: ubuntu-latest
    needs: ['release-please']
    permissions:
      contents: read
      id-token: write
      attestations: write
    if: ${{ needs.release-please.outputs.package-client-released == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci
      - uses: ./.github/actions/build
        with:
          workspace_path: packages/client
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: 'packages/client/*.tgz'
      - uses: ./.github/actions/setup-release-node
      - uses: ./.github/actions/publish
        with:
          workspace_path: packages/client
          prerelease: 'false'
          dry_run: 'false'

  release-ai-node:
    runs-on: ubuntu-latest
    needs: ['release-please']
    permissions:
      contents: read
      id-token: write
      attestations: write
    if: ${{ needs.release-please.outputs.package-ai-node-released == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci
      - uses: ./.github/actions/build
        with:
          workspace_path: packages/ai-node
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: 'packages/ai-node/*.tgz'
      - uses: ./.github/actions/setup-release-node
      - uses: ./.github/actions/publish
        with:
          workspace_path: packages/ai-node
          prerelease: 'false'
          dry_run: 'false'

  release-ai-otel:
    runs-on: ubuntu-latest
    needs: ['release-please']
    permissions:
      contents: read
      id-token: write
      attestations: write
    if: ${{ needs.release-please.outputs.package-ai-otel-released == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci
      - uses: ./.github/actions/build
        with:
          workspace_path: packages/ai-otel
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: 'packages/ai-otel/*.tgz'
      - uses: ./.github/actions/setup-release-node
      - uses: ./.github/actions/publish
        with:
          workspace_path: packages/ai-otel
          prerelease: 'false'
          dry_run: 'false'

  release-claude-agents:
    runs-on: ubuntu-latest
    needs: ['release-please']
    permissions:
      contents: read
      id-token: write
      attestations: write
    if: ${{ needs.release-please.outputs.package-claude-agents-released == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci
      - uses: ./.github/actions/build
        with:
          workspace_path: packages/claude-agents
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: 'packages/claude-agents/*.tgz'
      - uses: ./.github/actions/setup-release-node
      - uses: ./.github/actions/publish
        with:
          workspace_path: packages/claude-agents
          prerelease: 'false'
          dry_run: 'false'

  release-claude-messages:
    runs-on: ubuntu-latest
    needs: ['release-please']
    permissions:
      contents: read
      id-token: write
      attestations: write
    if: ${{ needs.release-please.outputs.package-claude-messages-released == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci
      - uses: ./.github/actions/build
        with:
          workspace_path: packages/claude-messages
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: 'packages/claude-messages/*.tgz'
      - uses: ./.github/actions/setup-release-node
      - uses: ./.github/actions/publish
        with:
          workspace_path: packages/claude-messages
          prerelease: 'false'
          dry_run: 'false'

  release-openai-agents:
    runs-on: ubuntu-latest
    needs: ['release-please']
    permissions:
      contents: read
      id-token: write
      attestations: write
    if: ${{ needs.release-please.outputs.package-openai-agents-released == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci
      - uses: ./.github/actions/build
        with:
          workspace_path: packages/openai-agents
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: 'packages/openai-agents/*.tgz'
      - uses: ./.github/actions/setup-release-node
      - uses: ./.github/actions/publish
        with:
          workspace_path: packages/openai-agents
          prerelease: 'false'
          dry_run: 'false'

  release-openai-messages:
    runs-on: ubuntu-latest
    needs: ['release-please']
    permissions:
      contents: read
      id-token: write
      attestations: write
    if: ${{ needs.release-please.outputs.package-openai-messages-released == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci
      - uses: ./.github/actions/build
        with:
          workspace_path: packages/openai-messages
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: 'packages/openai-messages/*.tgz'
      - uses: ./.github/actions/setup-release-node
      - uses: ./.github/actions/publish
        with:
          workspace_path: packages/openai-messages
          prerelease: 'false'
          dry_run: 'false'

  release-langchain-agents:
    runs-on: ubuntu-latest
    needs: ['release-please']
    permissions:
      contents: read
      id-token: write
      attestations: write
    if: ${{ needs.release-please.outputs.package-langchain-agents-released == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci
      - uses: ./.github/actions/build
        with:
          workspace_path: packages/langchain-agents
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: 'packages/langchain-agents/*.tgz'
      - uses: ./.github/actions/setup-release-node
      - uses: ./.github/actions/publish
        with:
          workspace_path: packages/langchain-agents
          prerelease: 'false'
          dry_run: 'false'

  release-langchain-messages:
    runs-on: ubuntu-latest
    needs: ['release-please']
    permissions:
      contents: read
      id-token: write
      attestations: write
    if: ${{ needs.release-please.outputs.package-langchain-messages-released == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci
      - uses: ./.github/actions/build
        with:
          workspace_path: packages/langchain-messages
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: 'packages/langchain-messages/*.tgz'
      - uses: ./.github/actions/setup-release-node
      - uses: ./.github/actions/publish
        with:
          workspace_path: packages/langchain-messages
          prerelease: 'false'
          dry_run: 'false'

  # --- Manual publish ---

  manual-publish:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.canary_versions == '' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci
      - uses: ./.github/actions/build
        with:
          workspace_path: ${{ inputs.workspace_path }}
      - uses: ./.github/actions/setup-release-node
      - uses: ./.github/actions/publish
        with:
          workspace_path: ${{ inputs.workspace_path }}
          prerelease: ${{ inputs.prerelease }}
          dry_run: ${{ inputs.dry_run }}

  # --- Published-artifact Lambda release canary ---
  #
  # Proves the versions that just landed on npm can be installed into a clean CommonJS
  # package, bundled by Serverless 3 + Webpack 5 + webpack-node-externals 3, loaded by a real
  # Node 22 Lambda, and removed again. It loads packages only — no SDK key, no flag evaluation,
  # no model call. See integration-tests/lambda-commonjs/README.md for the required AWS role.

  release-canary:
    name: Published-artifact Lambda canary
    runs-on: ubuntu-latest
    needs:
      - release-please
      - release-client
      - release-ai-node
      - release-ai-otel
      - release-openai-messages
    if: >-
      ${{ always()
        && !contains(needs.*.result, 'failure')
        && !contains(needs.*.result, 'cancelled')
        && vars.AWS_LAMBDA_CANARY_ROLE_ARN != ''
        && (github.event_name != 'workflow_dispatch' || inputs.canary_versions != '')
        && (github.event_name == 'workflow_dispatch'
          || needs.release-please.outputs.package-ai-node-released == 'true'
          || needs.release-please.outputs.package-ai-otel-released == 'true'
          || needs.release-please.outputs.package-openai-messages-released == 'true') }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_LAMBDA_CANARY_REGION || 'us-east-1' }}
      CANARY_STAGE: c${{ github.run_id }}-${{ github.run_attempt }}
      SLS_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve canary versions
        id: versions
        env:
          REQUESTED_VERSIONS: ${{ inputs.canary_versions }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED_VERSIONS:-}" ]; then
            resolved="$REQUESTED_VERSIONS"
          else
            resolved=$(node -e "const m=require('./.release-please-manifest.json');process.stdout.write(['ai-node','openai-messages','ai-otel'].map((p)=>p+'='+m['packages/'+p]).join(','))")
          fi
          echo "Canary versions: $resolved"
          echo "resolved=$resolved" >> "$GITHUB_OUTPUT"

      - name: Wait for the versions to be visible on npm
        env:
          LD_AI_CANARY_VERSIONS: ${{ steps.versions.outputs.resolved }}
        run: node integration-tests/lambda-commonjs/canary.mjs wait

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          audience: 'https://github.com/launchdarkly'
          role-to-assume: ${{ vars.AWS_LAMBDA_CANARY_ROLE_ARN }}
          role-session-name: JsAiSdkLambdaCanary
          aws-region: ${{ env.AWS_REGION }}

      - name: Build the canary package
        env:
          LD_AI_CANARY_VERSIONS: ${{ steps.versions.outputs.resolved }}
        run: node integration-tests/lambda-commonjs/canary.mjs build --package --stage="$CANARY_STAGE"

      - name: Deploy the ephemeral Lambda
        working-directory: integration-tests/lambda-commonjs/.canary/app
        run: npx serverless deploy --stage "$CANARY_STAGE"

      - name: Invoke and assert the capability payload
        env:
          LD_AI_CANARY_VERSIONS: ${{ steps.versions.outputs.resolved }}
        run: |
          set -euo pipefail
          aws lambda invoke \
            --function-name "ld-ai-canary-$CANARY_STAGE" \
            --cli-binary-format raw-in-base64-out \
            --payload '{}' \
            response.json
          cat response.json
          node integration-tests/lambda-commonjs/canary.mjs assert --response=response.json

      - name: Remove the ephemeral Lambda
        if: always()
        run: |
          set -uo pipefail
          status=0
          (cd integration-tests/lambda-commonjs/.canary/app && npx serverless remove --stage "$CANARY_STAGE") || status=1
          aws logs delete-log-group --log-group-name "/aws/lambda/ld-ai-canary-$CANARY_STAGE" 2>/dev/null || true
          if [ "$status" -ne 0 ]; then
            echo "::error::Canary cleanup failed — check for a leftover ld-ai-canary-$CANARY_STAGE stack"
          fi
          exit "$status"
