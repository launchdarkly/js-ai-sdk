name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so an advisory published against an unchanged lockfile still surfaces.
  schedule:
    - cron: '0 13 * * 1'

# The `setup` job installs deps and builds @launchdarkly/ai-server (the core client),
# then shares the compiled output with downstream jobs via the `client-dist`
# artifact. Handler package typecheck and tests require the client to be built
# first since they resolve types from its compiled dist.

permissions:
  contents: read

jobs:
  # ─── Setup ──────────────────────────────────────────────────────────────────
  setup:
    name: Install & build core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build client package
        run: yarn workspace @launchdarkly/ai-server build

      - name: Upload client build
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: packages/client/dist
          retention-days: 1

  # ─── Format & lint ──────────────────────────────────────────────────────────
  format:
    name: Format & lint (Biome)
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Format & lint check
        run: yarn code:check

  # ─── Lint ───────────────────────────────────────────────────────────────────
  lint:
    name: Package consistency
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Package consistency (sherif)
        run: yarn lint:pkg

  # ─── Dependency audit ───────────────────────────────────────────────────────
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # A newly published advisory must not turn every open PR red; push and the weekly run still fail.
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Audit runtime dependencies
        run: make audit

  # ─── Type check ─────────────────────────────────────────────────────────────
  typecheck:
    name: Type check
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download client build
        uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: packages/client/dist

      - name: Type check all packages
        run: yarn typecheck

      # Fails when a public name or signature changes in any entry point
      # without its checked-in report under packages/<package>/etc/ being
      # updated (yarn api:update).
      - name: Check API reports
        run: yarn api:check

      # Fails when an entry point exports a name its approved list in
      # api-surface/ does not allow, or stops exporting an unmarked one. Runs
      # after api:check, which guarantees the reports it reads are current.
      - name: Test the API surface check
        run: yarn test:api-surface

      - name: Check exports against the approved API surface
        run: yarn api:surface

      # The PR and release checks themselves run in api-compatibility.yml.
      - name: Test the API compatibility check
        run: yarn test:api-breaking

  # ─── Test ───────────────────────────────────────────────────────────────────
  test:
    name: Tests
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download client build
        uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: packages/client/dist

      - name: Run tests
        run: yarn test

  # ─── CommonJS/Webpack integration ───────────────────────────────────────────
  # Packs the workspaces, installs the tarballs into an isolated CommonJS consumer,
  # bundles it with Webpack + webpack-node-externals, and invokes the bundle. Node 22
  # matches the AWS Lambda runtime the failure was reported on; Node 24 is the current LTS.
  integration-commonjs-webpack:
    name: CommonJS/Webpack integration (Node ${{ matrix.node }})
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: CommonJS/Webpack integration tests
        run: yarn test:integration

  # ─── Build ──────────────────────────────────────────────────────────────────
  build:
    name: Build all packages
    needs: [format, lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build all packages
        run: yarn build

      - name: Test the packaging check
        run: yarn test:check-packaging

      # Fails when a package imports something it does not declare, or when the
      # packed tarballs do not install together and load through require() and
      # import() in an empty project. The workspace tests cannot catch either,
      # because the workspace installs every package's dependencies at once.
      - name: Check the packed packages install and load
        run: yarn check:packaging
