name: CI

on:
  push:
    branches: [main]
  pull_request:

# The `setup` job installs deps and builds @launchdarkly/ai-server (the core client),
# then shares the compiled output with downstream jobs via the `client-dist`
# artifact. Handler package typecheck and tests require the client to be built
# first since they resolve types from its compiled dist.

permissions:
  contents: read

jobs:
  # ─── Setup ──────────────────────────────────────────────────────────────────
  setup:
    name: Install & build core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build client package
        run: yarn workspace @launchdarkly/ai-server build

      - name: Upload client build
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: packages/client/dist
          retention-days: 1

  # ─── Format & lint ──────────────────────────────────────────────────────────
  format:
    name: Format & lint (Biome)
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Format & lint check
        run: yarn code:check

  # ─── Lint ───────────────────────────────────────────────────────────────────
  lint:
    name: Package consistency
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Package consistency (sherif)
        run: yarn lint:pkg

  # ─── Type check ─────────────────────────────────────────────────────────────
  typecheck:
    name: Type check
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download client build
        uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: packages/client/dist

      - name: Type check all packages
        run: yarn typecheck

  # ─── Test ───────────────────────────────────────────────────────────────────
  test:
    name: Tests
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download client build
        uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: packages/client/dist

      - name: Run tests
        run: yarn test

  # ─── Build ──────────────────────────────────────────────────────────────────
  build:
    name: Build all packages
    needs: [format, lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build all packages
        run: yarn build
