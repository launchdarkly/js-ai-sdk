version: 2
updates:
  - package-ecosystem: 'npm'
    # Yarn workspace root: one yarn.lock covers every packages/* workspace.
    directory: '/'
    schedule:
      interval: 'daily'
    cooldown:
      default-days: 7
    ignore:
      # vitest 5 drops vite as a dependency, which Yarn 1 then never installs (see #52).
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
  - package-ecosystem: 'github-actions'
    # '/' covers .github/workflows only; the composite actions pin their own actions.
    directories:
      - '/'
      - '/.github/actions/*'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
