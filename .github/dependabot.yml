version: 2
updates:
  - package-ecosystem: 'npm'
    # Yarn workspace root: one yarn.lock covers every packages/* workspace.
    directory: '/'
    schedule:
      interval: 'daily'
    cooldown:
      default-days: 7
  - package-ecosystem: 'github-actions'
    # Workflow files stored in the
    # default location of `.github/workflows`
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
