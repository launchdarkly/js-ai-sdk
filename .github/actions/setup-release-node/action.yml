name: Setup Node.js for Release
description: Installs Node.js with npm registry and updates npm for OIDC publishing
runs:
  using: composite
  steps:
    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: yarn
        registry-url: 'https://registry.npmjs.org'

    - name: Update npm
      shell: bash
      # Must be >= 11.5.1 for OIDC trusted publishing.
      run: npm install -g npm@11.6.2
