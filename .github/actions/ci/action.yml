name: CI
description: Install dependencies, lint, typecheck, and test

runs:
  using: composite
  steps:
    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: yarn

    - name: Install dependencies
      shell: bash
      run: yarn install --frozen-lockfile

    - name: Build core client
      shell: bash
      run: yarn workspace @launchdarkly/ai-server build

    - name: Format & lint check
      shell: bash
      run: yarn code:check

    - name: Package consistency
      shell: bash
      run: yarn lint:pkg

    - name: Type check
      shell: bash
      run: yarn typecheck

    - name: Test
      shell: bash
      run: yarn test
